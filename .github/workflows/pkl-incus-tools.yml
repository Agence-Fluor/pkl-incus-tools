name: Pkl Incus tools package

on:
  push:
    branches: ["**"]
    tags: ["pkl-incus-tools@*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/release-tag.sh "$TAG"
      - uses: actions/checkout@v7
        with:
          repository: Agence-Fluor/pkl-nix-tools
          ref: pkl-nix-tools@0.1.5
          path: .ci/pkl-nix-tools
      - run: echo "$GITHUB_WORKSPACE/.ci/pkl-nix-tools" >> "$GITHUB_PATH"
      - name: Check dependency locks
        run: |
          ./flake.pkl develop --command sh -ec 'pkl project resolve; (cd tests/consumer && pkl project resolve); git diff --exit-code -- PklProject.deps.json tests/consumer/PklProject.deps.json'
      - name: Test Pkl command and packaged consumer import
        run: >-
          ./flake.pkl develop
          --command sh scripts/test-package.sh
      - name: Build release package
        run: >-
          ./flake.pkl develop
          --command sh scripts/package-pkl.sh dist/package
      - uses: actions/upload-artifact@v7
        with:
          name: pkl-incus-tools-package
          path: dist/package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/pkl-incus-tools@')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - uses: actions/download-artifact@v8
        with:
          name: pkl-incus-tools-package
          path: dist/package
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-tag.sh "$TAG"
      - name: Publish Pkl package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#pkl-incus-tools@}
          gh release create "$TAG" \
            "dist/package/pkl-incus-tools@$version" \
            "dist/package/pkl-incus-tools@$version.sha256" \
            "dist/package/pkl-incus-tools@$version.zip" \
            "dist/package/pkl-incus-tools@$version.zip.sha256" \
            --verify-tag --generate-notes
